groups:
  - name: netwatch_availability
    rules:
      - alert: EndpointDown
        expr: probe_success == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Узел недоступен: {{ $labels.instance }}"
          description: "Проверка {{ $labels.job }} для {{ $labels.instance }} не проходит более 1 минуты."

      - alert: HighProbeLatency
        expr: probe_duration_seconds > 1.5
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Высокая задержка ответа: {{ $labels.instance }}"
          description: "Время отклика {{ $labels.instance }} ({{ $labels.job }}) превышает 1.5с в течение 2 минут."

      - alert: SSLCertExpiringSoon
        expr: (probe_ssl_earliest_cert_expiry - time()) / 86400 < 14
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Скоро истекает SSL-сертификат: {{ $labels.instance }}"
          description: "До окончания действия сертификата {{ $labels.instance }} осталось менее 14 дней."

      - alert: DNSResolutionFailed
        expr: probe_success{job="blackbox_dns"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Ошибка DNS-резолвинга: {{ $labels.instance }}"
          description: "DNS-сервер {{ $labels.instance }} не отвечает на запросы."
